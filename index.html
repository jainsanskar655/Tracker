<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    
    <div class="container">
        <header class="header">
            <h1>My Task Tracker</h1>
            <div class="date-display">
                <span id="current-date"></span>
                <span id="current-time"></span>
            </div>
            <div class="theme-toggle">
             <label class="switch">
                 <input type="checkbox" id="theme-switch">
                <span class="slider"></span>
            </label>
            </div>

        </header>

        <div class="main-content">
            <div class="sidebar">
                <div class="sidebar-menu">
                    <button data-view="dashboard"><i class="fas fa-chart-bar"></i> Dashboard</button>
                    <button class="active" data-view="tasks"><i class="fas fa-tasks"></i> Tasks</button>
                    <button data-view="calendar"><i class="fas fa-calendar-alt"></i> Calendar</button>
                    <button data-view="chat" id="chat-tab-btn" class="hidden"><i class="fas fa-comments"></i> Messaging</button>
                    <button data-view="game"><i class="fas fa-gamepad"></i> Relax Game</button>
                </div>
                <div class="user-mood">
                    <h3>How are you feeling?</h3>
                    <div class="mood-options">
                        <span data-mood="happy">😊</span>
                        <span data-mood="neutral">😐</span>
                        <span data-mood="sad">😔</span>
                        <span data-mood="angry">😠</span>
                        <span data-mood="excited">🤩</span>
                    </div>
                </div>
            </div>

            <div class="content-area">
                <!-- Dashboard View -->
                <div class="view hidden" id="dashboard-view">
                 <h2>Dashboard Overview</h2>
                <div class="dashboard-grid">
                <div class="chart-box">
            <canvas id="tasks-by-priority"></canvas>
            </div>
            <div class="chart-box">
            <canvas id="task-status"></canvas>
                </div>
                <div class="chart-box full-width">
            <canvas id="tasks-per-day"></canvas>
                </div>
             </div>
            </div>
    <div class="view hidden" id="chat-view">
    <div class="chat-layout">
    <div class="chat-users" id="chat-users"></div>
    <div class="chat-panel">
  <div id="chat-with-label" style="font-weight: bold; margin-bottom: 8px;"></div>
  <div id="chat-thread"></div>
  <div class="chat-input-box">
    <input type="text" id="chat-msg" placeholder="Type a message...">
    <button id="chat-send">Send</button>
  </div>
</div>

            </div>
                </div>

                <!-- Tasks View -->
                <div class="view" id="tasks-view">
                    <div id="suggestion-bot" class="suggestion-box hidden">
                        <i class="fas fa-robot"></i>
                        <span id="suggestion-text"></span>
                    </div>

                    <div class="task-input">
                        <input type="text" id="new-task" placeholder="Add a new task...">
                        <input type="date" id="task-date">
                        <input type="time" id="task-time">
                        <select id="task-priority">
                            <option value="low">Low Priority</option>
                            <option value="medium">Medium Priority</option>
                            <option value="high">High Priority</option>
                        </select>
                        <button id="add-task"><i class="fas fa-plus"></i> Add Task</button>
                    </div>
                    <div class="task-filters">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="today">Today</button>
                        <button class="filter-btn" data-filter="week">This Week</button>
                        <button class="filter-btn" data-filter="high">High Priority</button>
                        <button class="filter-btn" data-filter="completed">Completed</button>
                    </div>
                    <div class="task-list">
                        <div class="task-category">
                            <h3>Pending Tasks</h3>
                            <div class="tasks" id="pending-tasks"></div>
                        </div>
                        <div class="task-category">
                            <h3>Completed Tasks</h3>
                            <div class="tasks" id="completed-tasks"></div>
                        </div>
                    </div>
                </div>
                

                <!-- Calendar View -->
                <div class="view hidden" id="calendar-view">
                    <div class="calendar-header">
                        <button id="prev-month"><i class="fas fa-chevron-left"></i></button>
                        <h2 id="current-month-year">Month Year</h2>
                        <button id="next-month"><i class="fas fa-chevron-right"></i></button>
                    </div>
                    <div class="calendar-grid">
                        <div class="calendar-weekdays">
                            <div>Sun</div>
                            <div>Mon</div>
                            <div>Tue</div>
                            <div>Wed</div>
                            <div>Thu</div>
                            <div>Fri</div>
                            <div>Sat</div>
                        </div>
                        <div class="calendar-days" id="calendar-days"></div>
                    </div>
                    <div class="calendar-events" id="calendar-events">
                        <h3>Tasks for <span id="selected-date"></span></h3>
                        <div id="date-tasks"></div>
                    </div>
                </div>

                <!-- Game View -->
                <div class="view hidden" id="game-view">
                    <div class="game-container">
                        <h2>Bubble Pop Relaxation</h2>
                        <div class="game-stats">
                            <span>Score: <span id="score">0</span></span>
                            <span>Time: <span id="time">30</span>s</span>
                        </div>
                        <div class="game-area" id="game-area"></div>
                        <button id="start-game">Start Game</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Reminder Modal -->
    <div class="modal hidden" id="reminder-modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Reminder!</h2>
            <div id="reminder-content"></div>
            <div class="motivational-quote"></div>
            <button id="snooze-reminder">Snooze for 5 mins</button>
            <button id="dismiss-reminder">Dismiss</button>
        </div>
    </div>
    <div id="auth-screen" class="modal show">
  <div class="modal-content auth-box">
    <h2 id="auth-title">Login</h2>

    <input type="text" id="auth-username" placeholder="Username">
    <input type="password" id="auth-password" placeholder="Password">

    <button id="auth-submit">Login</button>
    <p>Don't have an account? <a href="#" id="toggle-auth-mode">Register here</a></p>
    <p id="auth-message"></p>
  </div>
</div>

<button id="logout-btn" class="hidden">Logout</button>

    <!-- Chatbot -->
    

        <div id="chat-inbox" class="hidden">
    <h3>Send a Message</h3>
  <select id="chat-recipient"></select>
  <div id="chat-thread"></div>
  <input type="text" id="chat-msg" placeholder="Type your message...">
  <button id="chat-send">Send</button>
</div>


<button id="logout-btn" class="hidden">Logout</button>
<button id="change-password-btn" class="hidden">Change Password</button>

    <!-- Confetti Animation -->
    <canvas id="confetti-canvas" class="hidden"></canvas>

    <script src="script.js"></script>
</body>
</html>
